name: AI Executive Meeting Brief

on:
  workflow_dispatch:

jobs:
  prepare-meeting:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Read meeting input
        run: |
          echo "=== MEETING INPUT ==="
          cat meeting_input.md
          echo "=== END MEETING INPUT ==="

          - name: Create meeting brief
            run: |
          cp examples/example_output.md meeting_brief.md

      - name: Show generated brief
        run: |
          echo "=== GENERATED EXECUTIVE BRIEF ==="
          cat meeting_brief.md
          echo "=== END GENERATED EXECUTIVE BRIEF ==="

